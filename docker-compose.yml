# Build/run production-like stack locally (frontend nginx + backend Express).
# MySQL: dùng XAMPP local hoặc host khác qua DATABASE_URL.
services:
  backend:
    build: ./backend
    ports:
      - "3333:3333"
    environment:
      PORT: "3333"
      DATABASE_URL: ${DATABASE_URL:-mysql://root:@host.docker.internal:3306/buywise}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3003}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
    ports:
      - "3003:80"
    depends_on:
      - backend