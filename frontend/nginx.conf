server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers.
  # CSP cho phép Google Fonts + ảnh/API https bên ngoài (ảnh sản phẩm, VITE_API_URL cross-origin).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-DNS-Prefetch-Control "off" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # SPA fallback (React Router-style deep links)
  location / {
    try_files $uri $uri/ /index.html;
  }
}